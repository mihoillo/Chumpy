name: Windows desktop build
on:
  push:
    branches: [windows-port]
  pull_request:
    branches: [windows-port]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows app
        run: .\\gradlew.bat -p windows-app test installDist
      - name: Package Windows executable
        run: jpackage --type app-image --name Chumpy --input windows-app/build/install/Chumpy-Windows/lib --main-jar Chumpy-Windows-0.1.0.jar --main-class slop.miho.chumpy.windows.MainKt --dest windows-app/build/package
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Chumpy-Windows
          path: windows-app/build/package/Chumpy/
          if-no-files-found: error
